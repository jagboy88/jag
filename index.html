<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <script>
      // Before first paint: mark JS as available (animated elements start
      // hidden, see index.css) and, if the homepage intro will play, show a
      // black curtain so the page never flashes before it.
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        try {
          var p = location.pathname;
          var rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
          var at = +localStorage.getItem('impact:intro-seen-at');
          var seen = at > 0 && Date.now() - at < 864e5;
          if (!rm && !seen && (p === '/' || p === '/index.html')) d.classList.add('intro-pending');
        } catch (e) {}
      })();
    </script>
    <!--seo:start-->
    <title>Impact Media GTA — Video Content, Social &amp; Meta Ads for Service Businesses</title>
    <meta
      name="description"
      content="We come to your business, shoot with professional videographers, edit in-house, and run your social media and Meta ads. Greater Toronto Area."
    />
    <link rel="canonical" href="https://impactmediagroup.ca/" />
    <!--seo:end-->

    <!-- Social sharing (Instagram DMs, WhatsApp, iMessage, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Impact Media GTA" />
    <meta property="og:locale" content="en_CA" />
    <meta name="twitter:card" content="summary" />

    <!-- Icons (from the Impact Media logo) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Jost:ital,wght@0,300..600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-jet text-ivory antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
