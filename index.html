    <!-- Structured data: who we are, where, and what we sell -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "@id": "https://impactmediagroup.ca/#business",
        "name": "Impact Media GTA",
        "alternateName": "Impact Media Group",
        "url": "https://impactmediagroup.ca/",
        "email": "contact@impactmediagroup.ca",
        "description": "On-site video content shoots, in-house editing, social media management and Meta ads for service-based businesses in the Greater Toronto Area.",
        "areaServed": [
          { "@type": "AdministrativeArea", "name": "Greater Toronto Area" },
          { "@type": "City", "name": "Toronto" },
          { "@type": "City", "name": "Mississauga" },
          { "@type": "City", "name": "Vaughan" },
          { "@type": "City", "name": "Markham" },
          { "@type": "City", "name": "Brampton" }
        ],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Toronto",
          "addressRegion": "ON",
          "addressCountry": "CA"
        },
        "sameAs": ["https://www.instagram.com/impactmediagta"],
        "knowsAbout": [
          "Video production",
          "Short-form video",
          "Social media management",
          "Meta advertising",
          "Content marketing for service businesses"
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Services",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "On-Site Video Content Shoots",
                "description": "Professional videographers film at your business location — your team, your space and your work in action."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Video Editing",
                "description": "In-house editors cut every clip with colour, sound, captions and pacing tuned for social platforms."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Social Media Management",
                "description": "End-to-end management of Instagram, TikTok, Facebook and YouTube: scheduling, captions, community replies and reporting."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Meta Ads Management",
                "description": "Paid campaigns on Facebook and Instagram built on the content we shoot, with targeting, creative testing and budget management."
              }
            }
          ]
        }
      }
    </script>
