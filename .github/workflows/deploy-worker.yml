name: Deploy contact Worker

on:
  push:
    branches: [master]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contact-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Lets the deploy step skip cleanly until the secrets have been added.
      READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.PUSHOVER_TOKEN != '' && secrets.PUSHOVER_USER != '' && secrets.TURNSTILE_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node --test worker/test/*.test.js

      - name: Secrets not configured yet
        if: env.READY != 'true'
        run: |
          echo "::notice::Skipping deploy: add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, PUSHOVER_TOKEN, PUSHOVER_USER and TURNSTILE_SECRET in Settings → Secrets and variables → Actions, then re-run this workflow."

      - name: Deploy to Cloudflare
        if: env.READY == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          # Pinned: [[ratelimits]] in wrangler.toml needs a recent wrangler 4.
          wranglerVersion: '4.151.3'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            PUSHOVER_TOKEN
            PUSHOVER_USER
            TURNSTILE_SECRET
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
